//Fabric port build (branch fabric/1.21.x). The upstream NeoForge build lives on the 1.21.x branch.
//Phase 0: only the src/fabric bootstrap source set is live; api/main are enabled as porting phases land (see PORTING.md).
plugins {
    id('java')
    id('idea')
    id('fabric-loom').version("${loom_version}")
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.6.0'
    distributionType = Wrapper.DistributionType.ALL
}

defaultTasks('build')

version = "${mod_version}+fabric"
group = 'mekanism'
base.archivesName = 'Mekanism-Fabric'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of("${java_version}")
    }
    withSourcesJar()
}

loom {
    //Generated from META-INF/accesstransformer.cfg by fabric-port/at2aw.py (see PORTING.md)
    accessWidenerPath = file('src/fabric/resources/mekanism.accesswidener')
}

sourceSets {
    main {
        //fabric_shim: Fabric-backed stand-ins for NeoForge classes (same simple names; see fabric-port/README.md).
        //Upstream api/main srcDirs join this list as porting phases land (see PORTING.md).
        java.srcDirs = ['src/fabric/java', 'src/fabric_shim/java', 'src/api/java']
        resources.srcDirs = ['src/fabric/resources']
        //Phase 1f grind switch: compile src/main with `gradlew compileJava -PportMain`.
        //Move src/main/java into the list above (and drop this block) once 1f is green.
        if (project.hasProperty('portMain')) {
            java.srcDirs += 'src/main/java'
        }
        //Phase 1f deferrals (inert until src/main/java joins srcDirs; see fabric-port/design/main-compile-plan.md):
        // client is Phase 4 — EXCEPT recipe_viewer/type (loader-agnostic data classes imported by
        // ~30 common files). Per-mod integrations are Phase 5; the integration/computer CORE stays
        // in (its annotations/wrappers are used by 80+ core tiles) — only the CC/OC2 bindings and
        // the one CC-touching helper are deferred. integration/energy core stays (used by tiles);
        // fluxnetworks/grandpower are Neo-only.
        java {
            //Allowlisted client files are loader-neutral data referenced by common code (recipe
            // viewer types appear in core tile signatures). If the allowlist needs to grow past a
            // handful of files, stop and hand-edit the dependency out instead (see the plan doc).
            def clientAllowlist = [
                'mekanism/client/recipe_viewer/type/',
                'mekanism/client/recipe_viewer/recipe/BoilerRecipeViewerRecipe.java',
                'mekanism/client/recipe_viewer/recipe/SPSRecipeViewerRecipe.java',
                'mekanism/client/recipe_viewer/emi/INamedRVRecipe.java',
            ]
            exclude { el ->
                if (el.directory) {
                    return false
                }
                def p = el.path
                p.startsWith('mekanism/client/') && !clientAllowlist.any { a -> p.startsWith(a) }
            }
            //Client-only holiday renderer that lives in the common package (its own javadoc says
            // "only reference from the client side"); depends on excluded client render classes
            // (QuadTransformation) + a client-bus event, so it belongs with Phase 4.
            exclude 'mekanism/common/base/holiday/ClientHolidayInfo.java'
            exclude { el ->
                //CC bindings are Phase 5, but ComputerConstants is a pure constants class used by
                // 22 core files — spare it
                !el.directory && el.path.startsWith('mekanism/common/integration/computer/computercraft/') &&
                      el.path != 'mekanism/common/integration/computer/computercraft/ComputerConstants.java'
            }
            exclude 'mekanism/common/integration/computer/opencomputers2/**'
            exclude 'mekanism/common/integration/computer/ComputerCapabilityHelper.java'
            exclude 'mekanism/common/integration/crafttweaker/**'
            exclude 'mekanism/common/integration/curios/**'
            exclude 'mekanism/common/integration/framedblocks/**'
            exclude 'mekanism/common/integration/gender/**'
            exclude 'mekanism/common/integration/jsonthings/**'
            exclude 'mekanism/common/integration/lookingat/**'
            exclude 'mekanism/common/integration/projecte/**'
            exclude 'mekanism/common/integration/energy/fluxnetworks/**'
            exclude 'mekanism/common/integration/energy/grandpower/**'
        }
    }
    //Upstream unit tests (src/test) are NeoForge-coupled; they come back in Phase 6 (see PORTING.md).
    //src/fabric_test holds port-owned guardrail tests: wire-format golden tests and transfer-bridge
    // semantics tests (see fabric-port/design/transfer-bridge.md). Run with: gradlew test
    test {
        java.srcDirs = ['src/fabric_test/java']
        resources.srcDirs = []
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Porting Lib (devOS)'
        url = 'https://mvn.devos.one/releases/'
    }
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
    maven {
        name = 'modmuss50 (team reborn)'
        url = 'https://maven.modmuss50.me/'
    }
    maven {
        name = 'NeoForged (standalone bus library only)'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'TerraformersMC (EMI)'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings(loom.officialMojangMappings())

    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    //Bridge libraries (resolution verified in Phase 0; wired in as porting phases land)
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")
    modImplementation("teamreborn:energy:${team_reborn_energy_version}") {
        transitive = false
    }

    //NeoForge's event bus is published as a loader-independent library; using it directly keeps upstream
    // net.neoforged.bus.api imports (IEventBus/Event/EventPriority/SubscribeEvent) valid with no remap.
    // Version matches the bus bundled in NeoForge ${neo_version}. asm + log4j-api (its runtime deps) are
    // already provided by the Fabric/Minecraft runtime, so only bus + typetools are jarred-in-jar.
    include(implementation("net.neoforged:bus:${neoforged_bus_version}"))
    include(implementation("net.jodah:typetools:${typetools_version}"))

    //Compile-time nullability annotations (upstream got these transitively through the NeoForge platform)
    compileOnly("org.jetbrains:annotations:${jetbrains_annotations_version}")
    compileOnly("com.google.code.findbugs:jsr305:${jsr305_version}")

    //Integration APIs referenced by src/api helper interfaces; runtime wiring is Phase 5
    compileOnly("mezz.jei:jei-1.21.1-common-api:${jei_fabric_api_version}")
    compileOnly("dev.emi:emi-fabric:${emi_fabric_version}:api")

    //Port guardrail tests (fabric-loader-junit boots Knot so game classes + mixins behave as in dev)
    testImplementation("net.fabricmc:fabric-loader-junit:${fabric_loader_version}")
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

processResources {
    //Capture values at configuration time; referencing script properties inside the closure
    // breaks the configuration cache
    def templateProps = [
          'version'              : version.toString(),
          'minecraft_version'    : minecraft_version.toString(),
          'fabric_loader_version': fabric_loader_version.toString(),
    ]
    inputs.properties(templateProps)
    filesMatching('fabric.mod.json') {
        //ReplaceTokens (@token@) instead of expand(): Groovy template expansion breaks on the $
        // in inner-class names inside loom:injected_interfaces (class_1792$class_1793)
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: templateProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(java_version)
    //Show the full error picture during the porting grind instead of javac's 100-error cap
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}
